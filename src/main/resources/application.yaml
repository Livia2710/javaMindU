spring:
  application:
    name: mindu
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mindu}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      max-lifetime: 300000
      connection-timeout: 30000

  jpa:
    database: POSTGRESQL
    hibernate:
      ddl-auto: update
    show-sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

mindu:
  agendamento:
    duracao-minutos: ${MINDU_AGENDAMENTO_DURACAO_MINUTOS:50}
    fuso-horario: ${MINDU_AGENDAMENTO_FUSO_HORARIO:America/Sao_Paulo}
  jwt:
    # Chaves abaixo são apenas para desenvolvimento local; produção usa o perfil prod.
    secret: "${MINDU_JWT_SECRET:local-dev-only-jwt-key-change-before-deploy-32bytes}"
    expiracao-ms: 3600000
  criptografia:
    chave: "${MINDU_CRIPTOGRAFIA_CHAVE:mindu-chave-16ch}"
  admin:
    senha-padrao: ${MINDU_ADMIN_SENHA:}
  cors:
    origens: ${CORS_ORIGENS:http://localhost:5173,http://localhost:3000,https://mind-u-pi.vercel.app}
