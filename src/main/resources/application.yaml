spring:
  application:
    name: mindu
  datasource:
    url: jdbc:postgresql://localhost:5432/mindu
    username: postgres
    password: postgres

  jpa:
    database: POSTGRESQL
    hibernate:
      ddl-auto: update
    show-sql: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mindu:
  jwt:
    secret: "coloque-uma-chave-bem-grande-e-secreta-aqui-pelo-menos-32-caracteres"
    expiracao-ms: 3600000
  criptografia:
    chave: "mindu-chave-16ch" # precisa ter exatamente 16, 24 ou 32 caracteres
  admin:
    senha-padrao: ${MINDU_ADMIN_SENHA:}
