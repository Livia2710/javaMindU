spring:
  application:
    name: mindu
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mindu}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    database: POSTGRESQL
    hibernate:
      ddl-auto: update
    show-sql: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mindu:
  jwt:
    secret: "${MINDU_JWT_SECRET:coloque-uma-chave-bem-grande-e-secreta-aqui-pelo-menos-32-caracteres}"
    expiracao-ms: 3600000
  criptografia:
    chave: "${MINDU_CRIPTOGRAFIA_CHAVE:mindu-chave-16ch}" # precisa ter exatamente 16, 24 ou 32 caracteres
  admin:
    senha-padrao: ${MINDU_ADMIN_SENHA:}
  cors:
    origens: ${CORS_ORIGENS:http://localhost:5173,http://localhost:3000}