services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mindu
    volumes:
      - mindu_local_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mindu"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mindu
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      MINDU_JWT_SECRET: local-dev-jwt-key-change-this-before-sharing-123456
      MINDU_CRIPTOGRAFIA_CHAVE: mindu-chave-16ch
      MINDU_ADMIN_SENHA: ${MINDU_ADMIN_SENHA:?Crie .env com MINDU_ADMIN_SENHA antes de iniciar}
    depends_on:
      db:
        condition: service_healthy

volumes:
  mindu_local_pgdata:
